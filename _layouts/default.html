<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}Ivan's Workspace</title>
    <link rel="stylesheet" href="{{ '/assets/journal.css' | relative_url }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="site-title"><a href="{{ '/' | relative_url }}">Ivan's Workspace<span class="blink-cursor"></span></a></div>
            <nav>
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/journal.html' | relative_url }}" class="{% if page.url == '/journal.html' %}active{% endif %}">Journal</a>
            </nav>
        </header>

        {{ content }}
    </div>
</body>
</html>
